<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2545"/><stop offset="1" stop-color="#13315c"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe6ee"/><stop offset="0.5" stop-color="#9fb0c3"/><stop offset="1" stop-color="#5c6f85"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#13a89e" stop-opacity="0.55"/><stop offset="1" stop-color="#13a89e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <circle cx="1050" cy="150" r="200" fill="url(#glow)"/>
  <!-- decorative bearing -->
