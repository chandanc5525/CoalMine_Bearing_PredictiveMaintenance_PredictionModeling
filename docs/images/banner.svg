  <text x="40" y="128" font-size="44" font-weight="700" fill="#ffffff">Coal Mine Conveyor</text>
  <text x="40" y="180" font-size="44" font-weight="700" fill="#ffffff">Bearing Failure Prediction</text>
  <text x="40" y="214" font-size="18" fill="#b8c7da">Forecasting idler bearing failures 7 days ahead from vibration, thermal, acoustic and operating data</text>
