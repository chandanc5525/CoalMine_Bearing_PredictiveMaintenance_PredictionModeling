    <circle r="118" fill="url(#steel)" stroke="#e8eef5" stroke-width="2"/>
    <circle r="96" fill="#0b2545" stroke="#6c8099" stroke-width="2"/>
    <g fill="url(#steel)" stroke="#e8eef5" stroke-width="1.5">
      <circle cx="74" cy="0" r="17"/><circle cx="52" cy="52" r="17"/><circle cx="0" cy="74" r="17"/><circle cx="-52" cy="52" r="17"/>
      <circle cx="-74" cy="0" r="17"/><circle cx="-52" cy="-52" r="17"/><circle cx="0" cy="-74" r="17"/><circle cx="52" cy="-52" r="17"/>
    </g>
    <circle r="56" fill="url(#steel)" stroke="#e8eef5" stroke-width="2"/>
    <circle r="30" fill="#0b2545" stroke="#6c8099" stroke-width="2"/>
    <polygon points="-14,-104 4,-90 -18,-86" fill="#d1495b"/>
  </g>
  <!-- vibration waveform -->
  <path d="M40 270 L120 270 L140 250 L160 290 L180 245 L205 295 L230 255 L250 275 L275 270 L420 270" fill="none" stroke="#13a89e" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
