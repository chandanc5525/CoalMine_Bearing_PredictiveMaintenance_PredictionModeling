<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#e9eef5"/></linearGradient>
    <radialGradient id="outer" cx="0.5" cy="0.5" r="0.5"><stop offset="0.82" stop-color="#8fa1b5"/><stop offset="0.9" stop-color="#d9e1ea"/><stop offset="1" stop-color="#8393a7"/></radialGradient>
    <radialGradient id="inner" cx="0.5" cy="0.5" r="0.5"><stop offset="0.5" stop-color="#74869b"/><stop offset="0.8" stop-color="#d4dce6"/><stop offset="1" stop-color="#8393a7"/></radialGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#b8c4d2"/><stop offset="1" stop-color="#6e7f94"/></radialGradient>
    <radialGradient id="pit" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2a2118"/><stop offset="1" stop-color="#6b4a2b"/></radialGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5ebf2"/><stop offset="0.5" stop-color="#a9b6c6"/><stop offset="1" stop-color="#d3dbe5"/></linearGradient>
    <clipPath id="lens"><circle cx="640" cy="225" r="105"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b2545" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1100" height="640" rx="14" fill="url(#bgp)" stroke="#d3dae3"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0b2545">Rolling Bearing Anatomy and Damage Signatures</text>
  <text x="40" y="78" font-size="14" fill="#52606d">Each defect location excites a characteristic frequency, captured by the four *_amplitude columns</text>

  <!-- cross-section -->
  <g transform="translate(250,262)" filter="url(#sh)">
    <circle r="168" fill="url(#outer)" stroke="#5c6f85" stroke-width="2"/>
    <circle r="134" fill="#f7f9fc" stroke="#5c6f85" stroke-width="2"/>
    <circle r="88" fill="url(#inner)" stroke="#5c6f85" stroke-width="2"/>
    <circle r="46" fill="#f7f9fc" stroke="#5c6f85" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-size="13" fill="#52606d">Shaft</text>
    <circle r="111" fill="none" stroke="#1a7f37" stroke-width="3" stroke-dasharray="8 6"/>
    <g fill="url(#ball)" stroke="#5c6f85" stroke-width="1.5">
      <circle cx="111" cy="0" r="23"/><circle cx="78.5" cy="78.5" r="23"/><circle cx="0" cy="111" r="23"/><circle cx="-78.5" cy="78.5" r="23"/>
      <circle cx="-111" cy="0" r="23"/><circle cx="-78.5" cy="-78.5" r="23"/><circle cx="0" cy="-111" r="23"/><circle cx="78.5" cy="-78.5" r="23"/>
    </g>
    <!-- defects -->
    <polygon points="-82,-134 -62,-146 -56,-128 -74,-120" fill="#7a1f2b"/>
    <polygon points="76,28 92,22 94,40 80,44" fill="#7a1f2b"/>
    <circle cx="0" cy="111" r="9" fill="url(#pit)"/>
  </g>
  <!-- letter markers -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="180" cy="124" r="11" fill="#cf222e"/><text x="180" y="128">A</text>
    <circle cx="344" cy="302" r="11" fill="#cf222e"/><text x="344" y="306">B</text>
    <circle cx="250" cy="373" r="11" fill="#cf222e"/><text x="250" y="377">C</text>
    <circle cx="347" cy="316" r="0" fill="#1a7f37"/>
    <circle cx="146" cy="347" r="11" fill="#1a7f37"/><text x="146" y="351">D</text>
  </g>
  <text x="250" y="462" text-anchor="middle" font-size="12" fill="#52606d">Cross-section: races, rolling elements, cage (dashed), shaft</text>

  <!-- zoom lines -->
  <g stroke="#7a1f2b" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <line x1="344" y1="292" x2="560" y2="150"/><line x1="344" y1="312" x2="560" y2="300"/>
  </g>
  <circle cx="344" cy="302" r="16" fill="none" stroke="#7a1f2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- magnified lens -->
  <g filter="url(#sh)"><circle cx="640" cy="225" r="107" fill="#fff" stroke="#7a1f2b" stroke-width="3"/></g>
  <g clip-path="url(#lens)">
    <rect x="520" y="100" width="240" height="250" fill="url(#surf)"/>
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"><line x1="520" y1="150" x2="760" y2="130"/><line x1="520" y1="200" x2="760" y2="190"/><line x1="520" y1="270" x2="760" y2="285"/></g>
    <path d="M590 180 L615 160 L650 170 L675 200 L665 240 L630 255 L600 240 L585 210 Z" fill="url(#pit)" stroke="#2a2118" stroke-width="2"/>
    <path d="M610 205 L640 195 L655 220 L630 235 Z" fill="#1b140d"/>
    <path d="M675 200 L705 185 L720 150 M665 240 L700 262 L728 255 M585 210 L555 215 L535 240 M615 160 L610 130 L625 112" fill="none" stroke="#3a2b1d" stroke-width="2" stroke-linecap="round"/>
    <g fill="#4a3624"><ellipse cx="700" cy="225" rx="9" ry="6"/><ellipse cx="560" cy="170" rx="7" ry="5"/><ellipse cx="715" cy="290" rx="8" ry="5"/><ellipse cx="575" cy="285" rx="6" ry="4"/><ellipse cx="690" cy="130" rx="6" ry="4"/></g>
  </g>
  <text x="640" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#7a1f2b">Spalling and pitting (magnified)</text>
  <text x="640" y="373" text-anchor="middle" font-size="12" fill="#52606d">Material flakes off the raceway and cracks spread</text>

  <!-- fault cards -->
  <g font-size="13" fill="#1f2d3d">
    <g filter="url(#sh)"><rect x="790" y="96" width="285" height="62" rx="10" fill="#fff" stroke="#cf222e"/></g>
    <circle cx="812" cy="120" r="11" fill="#cf222e"/><text x="812" y="124" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    <text x="832" y="118" font-weight="700" fill="#cf222e" font-size="14">BPFO · outer race defect</text><text x="832" y="140">column: bpfo_amplitude</text>

    <g filter="url(#sh)"><rect x="790" y="172" width="285" height="62" rx="10" fill="#fff" stroke="#cf222e"/></g>
    <circle cx="812" cy="196" r="11" fill="#cf222e"/><text x="812" y="200" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">B</text>
    <text x="832" y="194" font-weight="700" fill="#cf222e" font-size="14">BPFI · inner race defect</text><text x="832" y="216">column: bpfi_amplitude</text>

    <g filter="url(#sh)"><rect x="790" y="248" width="285" height="62" rx="10" fill="#fff" stroke="#cf222e"/></g>
    <circle cx="812" cy="272" r="11" fill="#cf222e"/><text x="812" y="276" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <text x="832" y="270" font-weight="700" fill="#cf222e" font-size="14">BSF · rolling element defect</text><text x="832" y="292">column: bsf_amplitude</text>

    <g filter="url(#sh)"><rect x="790" y="324" width="285" height="62" rx="10" fill="#fff" stroke="#1a7f37"/></g>
    <circle cx="812" cy="348" r="11" fill="#1a7f37"/><text x="812" y="352" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">D</text>
    <text x="832" y="346" font-weight="700" fill="#1a7f37" font-size="14">FTF · cage / retainer fault</text><text x="832" y="368">column: ftf_amplitude</text>
  </g>

  <!-- degradation strip -->
  <text x="40" y="498" font-size="15" font-weight="700" fill="#0b2545">Degradation path the model learns to detect</text>
  <g font-size="12" fill="#1f2d3d">
    <g filter="url(#sh)"><rect x="40" y="512" width="235" height="100" rx="10" fill="#fff" stroke="#1a7f37"/></g>
    <circle cx="68" cy="540" r="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><circle cx="68" cy="540" r="5" fill="#1a7f37"/>
    <text x="92" y="538" font-size="14" font-weight="700" fill="#1a7f37">1 · Healthy</text><text x="92" y="556">Smooth raceways</text>
    <text x="58" y="580">Low RMS, kurtosis and fault</text><text x="58" y="596">amplitudes, normal temperature</text>

    <g filter="url(#sh)"><rect x="296" y="512" width="235" height="100" rx="10" fill="#fff" stroke="#bf8700"/></g>
    <circle cx="324" cy="540" r="14" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/><circle cx="320" cy="536" r="2.5" fill="#7a5a00"/><circle cx="329" cy="543" r="2" fill="#7a5a00"/>
    <text x="348" y="538" font-size="14" font-weight="700" fill="#9a6700">2 · Early wear</text><text x="348" y="556">Micro-pitting begins</text>
    <text x="314" y="580">Kurtosis and BPFO/BPFI rise,</text><text x="314" y="596">lubrication ageing</text>

    <g filter="url(#sh)"><rect x="552" y="512" width="235" height="100" rx="10" fill="#fff" stroke="#d9730d"/></g>
    <circle cx="580" cy="540" r="14" fill="#fff1e5" stroke="#d9730d" stroke-width="2"/><ellipse cx="580" cy="540" rx="7" ry="5" fill="#6b4a2b"/>
    <text x="604" y="538" font-size="14" font-weight="700" fill="#b25100">3 · Spalling</text><text x="604" y="556">Flaking and cracking</text>
    <text x="570" y="580">High RMS and peak, acoustic</text><text x="570" y="596">level up, temperature climbing</text>

    <g filter="url(#sh)"><rect x="808" y="512" width="252" height="100" rx="10" fill="#fff" stroke="#cf222e"/></g>
    <circle cx="836" cy="540" r="14" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/><path d="M828 532 L844 548 M844 532 L828 548" stroke="#cf222e" stroke-width="3" stroke-linecap="round"/>
    <text x="860" y="538" font-size="14" font-weight="700" fill="#cf222e">4 · Failure</text><text x="860" y="556">Seizure or collapse</text>
    <text x="826" y="580">Belt damage, fire risk and</text><text x="826" y="596">unplanned downtime</text>
  </g>
  <g stroke="#52606d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M281 554 l7 8 l-7 8"/><path d="M537 554 l7 8 l-7 8"/><path d="M793 554 l7 8 l-7 8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
